# ===========================================
# Agents common settings
# ===========================================
x-agent-image: &agent-image bob-the-agent:latest
x-agent-env: &agent-env
  OLLAMA_BASE_URL: http://ollama:11434
  NODE_ENV: production
  HERMES_YOLO_MODE: 1
  LOG_LEVEL: ${LOG_LEVEL:-info}
  SEARXNG_BASE_URL: ${SEARXNG_BASE_URL}
  USER_X_COM_API_TOKEN: ${USER_X_COM_API_TOKEN}
  USER_XAI_SEARCH_API_KEY: ${USER_XAI_SEARCH_API_KEY}
  USER_AWS_S3_BUCKET: ${USER_AWS_S3_BUCKET}
  USER_AWS_S3_REGION: ${USER_AWS_S3_REGION}
  USER_AWS_S3_ACCESS_KEY_ID: ${USER_AWS_S3_ACCESS_KEY_ID}
  USER_AWS_S3_SECRET_ACCESS_KEY: ${USER_AWS_S3_SECRET_ACCESS_KEY}
  NATS_URL: nats://nats:4222
x-agent-healthcheck: &agent-healthcheck
  test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/8642' || exit 1"]
  interval: 30s
  timeout: 10s
  retries: 3
  start_period: 30s
x-agent-resources: &agent-resources
  reservations:
    cpus: 2
    memory: 2G
  limits:
    memory: 4G

services:
  # ===========================================
  # Ollama - Local LLM inference server
  # ===========================================
  ollama:
    image: ollama/ollama:latest
    container_name: bob-the-agent-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/11434' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        reservations:
          cpus: 1
          memory: 1G

  # ===========================================
  # Hermes Agent - Main AI agent / orchestrator
  # ===========================================
  agent-main:
    image: *agent-image
    container_name: bob-the-agent
    restart: unless-stopped
    depends_on:
      ollama:
        condition: service_healthy
      nats:
        condition: service_healthy
    environment:
      <<: *agent-env
      AGENT_NAME: main
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN}
    ports:
      - 8642:8642
    volumes:
      - ./volumes/agent-main:/opt/data
      - ./volumes/results:/app/results
      - ./volumes/projects:/app/projects
    healthcheck: *agent-healthcheck
    deploy:
      resources: *agent-resources
  # ===========================================================
  # Researcher Agent - AI agent focused on deep research tasks
  # ===========================================================
  researcher:
    image: *agent-image
    container_name: bob-the-agent-researcher
    restart: unless-stopped
    depends_on:
      ollama:
        condition: service_healthy
      nats:
        condition: service_healthy
    environment:
      <<: *agent-env
      AGENT_NAME: researcher
    volumes:
      - ./volumes/agent-researcher:/opt/data
      - ./volumes/results:/app/results
    healthcheck: *agent-healthcheck
    deploy:
      resources: *agent-resources
  # =====================================================================
  # Simple Agent - AI agent focused on conducting simple and cheap tasks
  # =====================================================================
  simple-agent:
    image: *agent-image
    container_name: bob-the-agent-simple
    restart: unless-stopped
    depends_on:
      ollama:
        condition: service_healthy
      nats:
        condition: service_healthy
    environment:
      <<: *agent-env
      AGENT_NAME: simple
    volumes:
      - ./volumes/agent-simple:/opt/data
      - ./volumes/results:/app/results
    healthcheck: *agent-healthcheck
    deploy:
      resources: *agent-resources
  # =====================================================================
  # Coder Agent - AI agent focused on software engineering tasks
  # Uses Hermes Agent + OpenCode CLI two-layer architecture
  # =====================================================================
  coder:
    image: *agent-image
    container_name: bob-the-agent-coder
    restart: unless-stopped
    depends_on:
      ollama:
        condition: service_healthy
      nats:
        condition: service_healthy
    environment:
      <<: *agent-env
      AGENT_NAME: coder
    volumes:
      - ./volumes/agent-coder:/opt/data
      - ./volumes/results:/app/results
      - ./volumes/projects:/app/projects
    healthcheck: *agent-healthcheck
    deploy:
      resources:
        reservations:
          cpus: 2
          memory: 4G
        limits:
          memory: 8G
    entrypoint: ["/app/scripts/coder-entrypoint.sh"]
    command: ["bash", "-c", "/usr/bin/tini -g -- /opt/hermes/docker/entrypoint.sh gateway run"]

  # ===========================================
  # SearXNG - Privacy-respecting metasearch engine
  # ===========================================
  searxng:
    image: searxng/searxng:${SEARXNG_VERSION:-2026.4.29-cba0cffa8}
    container_name: bob-the-agent-searxng
    restart: unless-stopped
    depends_on:
      valkey:
        condition: service_healthy
    environment:
      - SEARXNG_HOST=[::]
      - SEARXNG_PORT=8888
      - SEARXNG_BASE_URL=${SEARXNG_BASE_URL}
      - SEARXNG_VALKEY_URL=valkey://valkey:6379/0
    volumes:
      - searxng_config:/etc/searxng/
      - ./src/config/searxng.settings.yml:/etc/searxng/settings.yml:ro
      - searxng_data:/var/cache/searxng/
    ports:
      - "8888:8888"
    deploy:
      resources:
        reservations:
          cpus: 0.5
          memory: 512M
        limits:
          cpus: 1
          memory: 4G

  # ===========================================
  # Valkey - Redis-compatible cache for SearXNG
  # ===========================================
  valkey:
    image: valkey/valkey:9-alpine
    container_name: bob-the-agent-valkey
    restart: unless-stopped
    volumes:
      - valkey_data:/data
    command: valkey-server --save 30 1 --loglevel warning
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        reservations:
          cpus: 0.5
          memory: 128M
        limits:
          cpus: 0.5
          memory: 256M
  nats:
    image: nats:2.14.0-alpine3.22
    container_name: bob-the-agent-nats
    restart: unless-stopped
    ports:
      - "4222:4222"
      - "8222:8222"
    command: "--cluster_name nats --cluster nats://0.0.0.0:6222 --http_port 8222"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8222/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        reservations:
          cpus: 0.25
          memory: 64M
        limits:
          cpus: 0.5
          memory: 128M

# ===========================================
# Named Volumes
# ===========================================
volumes:
  ollama_data:
    driver: local
  searxng_config:
    driver: local
  searxng_data:
    driver: local
  valkey_data:
    driver: local

# ===========================================
# Networks
# ===========================================
networks:
  default:
    name: bob-the-agent-network