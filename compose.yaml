# ===========================================
# Agents common settings
# ===========================================
x-agent-image: &agent-image bob-the-agent:latest
x-agent-env: &agent-env
  OLLAMA_BASE_URL: http://ollama:11434
  NODE_ENV: production
  LOG_LEVEL: ${LOG_LEVEL:-info}
  SEARXNG_BASE_URL: ${SEARXNG_BASE_URL}
  USER_X_COM_API_TOKEN: ${USER_X_COM_API_TOKEN}
  USER_XAI_SEARCH_API_KEY: ${USER_XAI_SEARCH_API_KEY}
  USER_AWS_S3_BUCKET: ${USER_AWS_S3_BUCKET}
  USER_AWS_S3_REGION: ${USER_AWS_S3_REGION}
  USER_AWS_S3_ACCESS_KEY_ID: ${USER_AWS_S3_ACCESS_KEY_ID}
  USER_AWS_S3_SECRET_ACCESS_KEY: ${USER_AWS_S3_SECRET_ACCESS_KEY}
  HERMES_UID: ${HERMES_UID:-}
  HERMES_GID: ${HERMES_GID:-}
x-agent-healthcheck: &agent-healthcheck
  test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/8642' || exit 1"]
  interval: 30s
  timeout: 10s
  retries: 3
  start_period: 120s

services:
  # ===========================================
  # Ollama - Local LLM inference server
  # ===========================================
  ollama:
    image: ollama/ollama:latest
    container_name: bob-the-agent-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/11434' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        reservations:
          cpus: 1
          memory: 1G

  # ===========================================
  # Hermes Agent - single multiplexed agent
  # (profiles: main, researcher, simple, coder)
  # ===========================================
  agent:
    image: *agent-image
    container_name: bob-the-agent
    command: ["/app/scripts/bootstrap.sh"]
    ports:
      - "8642:8642"
    environment:
      <<: *agent-env
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN}
      OPENCODE_CONFIG: /opt/data/.config/opencode/opencode.jsonc
    volumes:
      - ./volumes/agent:/opt/data
      - ./volumes/results:/app/results
      - ./volumes/projects:/app/projects
    restart: unless-stopped
    depends_on:
      ollama:
        condition: service_healthy
      searxng:
        condition: service_started
    healthcheck: *agent-healthcheck
    deploy:
      resources:
        reservations:
          cpus: 2
          memory: 4G
        limits:
          memory: 8G

  # ===========================================
  # SearXNG - Privacy-respecting metasearch engine
  # ===========================================
  searxng:
    image: searxng/searxng:${SEARXNG_VERSION:-2026.4.29-cba0cffa8}
    container_name: bob-the-agent-searxng
    restart: unless-stopped
    depends_on:
      valkey:
        condition: service_healthy
    environment:
      - SEARXNG_HOST=[::]
      - SEARXNG_PORT=8888
      - SEARXNG_BASE_URL=${SEARXNG_BASE_URL}
      - SEARXNG_VALKEY_URL=valkey://valkey:6379/0
    volumes:
      - searxng_config:/etc/searxng/
      - ./src/config/searxng.settings.yml:/etc/searxng/settings.yml:ro
      - searxng_data:/var/cache/searxng/
    ports:
      - "8888:8888"
    deploy:
      resources:
        reservations:
          cpus: 0.5
          memory: 512M
        limits:
          cpus: 1
          memory: 4G

  # ===========================================
  # Valkey - Redis-compatible cache for SearXNG
  # ===========================================
  valkey:
    image: valkey/valkey:9-alpine
    container_name: bob-the-agent-valkey
    restart: unless-stopped
    volumes:
      - valkey_data:/data
    command: valkey-server --save 30 1 --loglevel warning
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        reservations:
          cpus: 0.5
          memory: 128M
        limits:
          cpus: 0.5
          memory: 256M

# ===========================================
# Named Volumes
# ===========================================
volumes:
  ollama_data:
    driver: local
  searxng_config:
    driver: local
  searxng_data:
    driver: local
  valkey_data:
    driver: local

# ===========================================
# Networks
# ===========================================
networks:
  default:
    name: bob-the-agent-network