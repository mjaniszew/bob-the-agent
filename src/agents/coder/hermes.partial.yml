model:
  default: glm-5.1:cloud
  provider: custom
  base_url: http://ollama:11434/v1
custom_providers:
- name: ollama/glm-5.1:cloud
  base_url: http://ollama:11434/v1
  model: glm-5.1:cloud
toolsets:
- hermes-cli
- browser
agent:
  max_turns: 120
  gateway_timeout: 7200
  restart_drain_timeout: 60
  api_max_retries: 6
  service_tier: ''
  tool_use_enforcement: auto
  gateway_timeout_warning: 3600
  gateway_notify_interval: 180
  gateway_auto_continue_freshness: 3600
  image_input_mode: auto
  disabled_toolsets: []
  verbose: false
  reasoning_effort: medium
  personalities:
    default: "You are specialist agent handling software engineering tasks: coding, code review, architecture planning. You orchestrate OpenCode CLI for coding work and bridge communication between main agent and OpenCode. You execute given tasks autonomously, asking questions only as a last resort."