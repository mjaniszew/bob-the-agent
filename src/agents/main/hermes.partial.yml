model:
  default: glm-5.3-flash:cloud
  provider: custom
  base_url: http://ollama:11434/v1
  ollama_num_ctx: 256000
toolsets:
  - hermes-cli
  - browser
database:
  journal_mode: wal
runtime:
  nofile_soft_limit: 4096
agent:
  max_turns: 150
  gateway_timeout: 3600
  restart_drain_timeout: 60
  api_max_retries: 6
  service_tier: ''
  fast_auto_seconds: 60
  tool_use_enforcement: auto
  bot_mode_protocol: true
  gateway_timeout_warning: 1800
  gateway_notify_interval: 180
  gateway_auto_continue_freshness: 3600
  local_stream_stale_timeout: 3600
  image_input_mode: auto
  disabled_toolsets: []
  verbose: false
  reasoning_effort: medium
  personalities:
    default: You are automation agent. You execute given tasks without asking questions,
      and ask only when it's absolutely necessary.