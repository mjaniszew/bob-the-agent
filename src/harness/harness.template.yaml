# Harness config template (ARCHITECTURE.md section 4, repo-finalized).
# Seeded once to the volume by bootstrap; user-editable; HARNESS_* env vars override (D12).

server: {host: "0.0.0.0", port: 8181}          # Q1: gateway port 8181
api_key: "${HARNESS_API_KEY}"                  # resolved from env, never stored plaintext; load fails fast when unset
rate_limit: {per_minute: 30, stream_per_minute: 600}
router: {provider: openai-compatible, base_url: "http://ollama:11434/v1", model: "glm-5.3-flash:cloud", api_key: null}   # Q3: ollama; env binds base_url/model only (HARNESS_ROUTER_API_KEY is NOT bound, see config.py)
agents:
  hermes: {enabled: true, bin: "/opt/hermes/.venv/bin/hermes", default_model: null, timeout_s: 3600, max_output_bytes: 4000000, profile_timeouts: {simple: 900, researcher: 3600}}
  opencode: {enabled: true, bin: "opencode", default_model: null, default_agent: build, timeout_s: 7200, workdir_root: "/app/projects", auto_approve: true}
handoff: {enabled: true, max_depth: 3}
tasks: {inbox: "tasks/inbox", poll_seconds: 2, max_concurrent: 1, max_depth: 2, retries: 1, gate_timeout_s: 86400, max_desc_chars: 4000}
scheduler: {enabled: true, jobs_file: "state/scheduler.json", misfire_grace_s: 60, coalesce: true, script_timeout_s: 600, jobs: []}
memory: {budgets: {memory_chars: 2200, user_chars: 1375, lessons_chars: 1500, index_chars: 1500}}
discord:
  enabled: true
  chunk_ms: 700
  chunk_chars: 1900
  allowlist: {allow_users: [], allow_roles: []}
  home_channel_id: null    # Q4: home channel for notices with no originating thread; env HARNESS_DISCORD_HOME_CHANNEL (fallback DISCORD_HOME_CHANNEL) binds it
storage:
  data_dir: "/opt/data/harness"   # literal: config.py fail-fasts on unset ${VAR}, so "${HARNESS_DATA_DIR}" would need the env var; HARNESS_DATA_DIR env-override still wins at deploy
