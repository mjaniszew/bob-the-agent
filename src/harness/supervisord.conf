# supervisord config for the harness long-runner (exec'd by bootstrap.sh).
# s6-overlay stays PID 1; supervisord is its child and owns the agent process tree.
# No user= key: bootstrap already runs as the `hermes` user (s6-setuidgid in
# main-wrapper.sh) — a setuid user= line would risk a refuse-to-start on uid
# semantics. On container stop the signal path is: docker stop -> s6 -> SIGTERM here
# -> supervisord gracefully stops its children (nodaemon + autorestart=unexpected).
# NOTE: supervisor accepts ONLY false/unexpected/true for autorestart — there is
# no "on-failure" value (that is a systemd-ism); `unexpected` restarts the
# harness when it exits with a code outside [exitcodes] (default 0), which is
# exactly the on-failure behavior the runtime design calls for. Verified against
# the bundled supervisor 4.3.0 docs (configuration.rst) + datatypes.auto_restart.
# Standard supervisorctl block is present so host boot checks can run
# `supervisorctl status` via the unix socket.
[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[unix_http_server]
file=/tmp/supervisor.sock

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:harness]
command=/opt/harness-venv/bin/python -m harness.supervisor
environment=PYTHONPATH="/app/harness",PYTHONUNBUFFERED="1",HOME="/opt/data",PATH="/usr/local/bin:/opt/hermes/.venv/bin:%(ENV_PATH)s"
directory=/app/harness
autorestart=unexpected
startretries=5
startsecs=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:opencode-serve]
command=/usr/local/bin/opencode serve --port 4096
autostart=false
